<div class="player-container">
    <!-- Botão customizado -->
    <button id="playBtn" aria-label="Play/Pause">
        <svg id="icon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </button>

    <!-- Barra de progresso -->
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>

    <!-- Contador de Plays visível na tela -->
    <div style="font-size: 14px; color: #666; margin-top: 10px;">
        Reproduções: <span id="playCount">0</span>
    </div>
</div>

<audio id="audio" src="https://github.com/Gacarvalho10/music/blob/main/loboguara.mp3" preload="metadata"></audio>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const icon = document.getElementById('icon');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const playCountElement = document.getElementById('playCount');

    const playIcon = '<path d="M8 5v14l11-7z"/>';
    const pauseIcon = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    let jaContouPlay = false;
    let totalPlays = 0; // No futuro, isso viria do seu banco de dados

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            icon.innerHTML = pauseIcon;
        } else {
            audio.pause();
            icon.innerHTML = playIcon;
        }
    });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percentage = (audio.currentTime / audio.duration) * 100;
            progress.style.width = percentage + '%';

            // Regra: Se a música passou de 10 segundos tocando, computa 1 play (válido apenas uma vez por player session)
            if (audio.currentTime > 1 && !jaContouPlay) {
                jaContouPlay = true;
                totalPlays++;
                playCountElement.textContent = totalPlays;
                
                // AQUI ENTRARIA O CÓDIGO PARA SALVAR NO BANCO DE DADOS
                salvarPlayNoServidor();
            }
        }
    });

    function salvarPlayNoServidor() {
        console.log("Play contabilizado e enviado para o banco de dados!");
        // Exemplo: fetch('https://seu-banco.com/api/play', { method: 'POST' });
    }

    progressBar.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const width = progressBar.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        audio.currentTime = (clickX / width) * duration;
    });

    audio.addEventListener('ended', () => {
        icon.innerHTML = playIcon;
        progress.style.width = '0%';
        jaContouPlay = false; // Reseta para permitir contar novamente se a pessoa der replay
    });
</script>
